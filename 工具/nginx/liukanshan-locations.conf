# 刘看山小游戏 —— 子路径共存配置（照「点废成金」那一套）
# 供宿主机原生 nginx 使用：在 agrimind-common.conf 里 include 本文件（80/443 共用）
#   include /etc/nginx/liukanshan-locations.conf;
#
# 路径映射：/刘看山/
#   ⚠️ nginx 的 location 匹配的是**百分号解码之后**的 URI，
#      所以这里**直接写中文原形**，不要写 %E5%88%98…（那反而匹配不上）。
# 磁盘布局：镜像 URL 结构（root 模式下 $uri 带前缀，index/SPA 回退天然自洽）
#   /srv/liukanshan/刘看山/index.html
#   /srv/liukanshan/刘看山/assets/...
# 纯静态：没有后端、没有反代（整站就是 dist 里的东西）。

# ---------- 目录 URL 规范化：无尾斜杠 301 补斜杠 ----------
# ⚠️ 必要：不补的话 /刘看山 会被下面的 agrimind 兜底 location / 接走（返回主站页面）。
location = /刘看山 { return 301 /刘看山/; }

# ---------- 带哈希的产物：长缓存（文件名里就有 hash，改了名字就变，读不到旧的） ----------
# ⚠️⚠️ 只对 `index-<hash>.js / .css` 长缓存 ✗
#    一开始我图省事把整个 /assets/ 都设成 30 天 ✗ —— 结果**重新生成的美术素材用户看不到**：
#    行走图叫 `chr_lu_walk.png`（**文件名不变** ✗），浏览器 30 天都拿旧的 ✔
#    （用户报"小鹿还是在摆头，请用新素材"，就是这个 ✔）
location ~ ^/刘看山/assets/index-[A-Za-z0-9_-]+\.(js|css)$ {
    root /srv/liukanshan;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

# ---------- 其它素材（png / wav / json / 字体）：**必须校验** ----------
# ⚠️ 这些文件**名字不带版本**，换素材后要能让玩家立刻拿到新的 ✔
location /刘看山/assets/ {
    root /srv/liukanshan;
    add_header Cache-Control "no-cache" always;
    expires -1;
}

# ---------- 知乎 OAuth 登录服务（本机 5310 端口，Node 零依赖）----------
# ⚠️ app_key 只在服务端（/etc/liukanshan-zhihu.env，600 权限 ✗），不进代码包 ✔
# ⚠️ 回调必须公网 HTTPS（官方要求 ✗）：https://zjhxbb.xyz/刘看山/api/zhihu/callback
# ---------- AI 队友的代理位（还没接 AI 模型）----------
# ⚠️⚠️ 这个 location **必须有**：前端会调 /刘看山/api/npc ✔，
#    没有它就会被兜底 location / 交给**主站（agrimind）后端** →
#    主站要鉴权 → 控制台一串 **401 Unauthorized** ✔（用户报的就是这个 ✗）
# ⚠️ 现在返回 **204 空响应**（成功状态 ✗ 不是错误 ✔）→ 游戏用兜底台词、控制台干净 ✔
#    将来接 AI（知乎直答）时，把这里换成 proxy_pass 到我们的 AI 服务即可 ✔
location = /刘看山/api/npc {
    add_header Cache-Control 'no-store' always;
    return 204;
}

# ⚠️ 纯英文别名（回调地址字段不接受中文时用这条 ✗）
#    两处转发到同一个本机服务 ✔
location /lks-zhihu/ {
    proxy_pass http://127.0.0.1:5310;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location /刘看山/api/zhihu/ {
    proxy_pass http://127.0.0.1:5310;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# ---------- 其余（index.html / audio / fonts）+ SPA 回退 ----------
# index.html 不缓存：部署后刷新立即生效，避免旧 HTML 引用已不存在的 hash 产物白屏。
location /刘看山/ {
    root /srv/liukanshan;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /刘看山/index.html;
}

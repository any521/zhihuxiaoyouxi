<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#202b3b" />
    <title>刘看山打工日记</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #18212f; background: radial-gradient(circle at 78% 12%, #d5f9e5 0 12%, transparent 29%), #f4f6f8; }
      main { width: min(880px, calc(100vw - 40px)); padding: 42px; box-sizing: border-box; border: 1px solid #e4eaf0; border-radius: 24px; background: rgba(255,255,255,.9); box-shadow: 0 20px 60px rgba(43,66,96,.12); }
      .tag { color: #178756; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
      h1 { margin: 14px 0 10px; font-size: clamp(34px, 6vw, 58px); letter-spacing: -.06em; }
      p { max-width: 620px; line-height: 1.7; color: #617086; font-size: 17px; }
      .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
      a { border-radius: 10px; padding: 12px 18px; font-weight: 700; text-decoration: none; }
      .start { color: white; background: #16c979; box-shadow: 0 8px 20px rgba(22,201,121,.24); }
      .subtle { color: #31577d; background: #eaf1f8; }
      .notice { display: none; margin-top: 18px; padding: 12px 14px; border-radius: 10px; color: #157a4b; background: #effaf4; }
    </style>
  </head>
  <body>
    <main>
      <div class="tag">知乎黑客松 2026 · 跨次元游乐场</div>
      <h1>🦊 刘看山打工日记</h1>
      <p>进入看山创意部的桌面微信，在 20 天实习中处理 8 个关键事件。自由追问 AI 角色，但职业结果只由你的选择决定。</p>
      <div class="actions">
        <a class="start" href="/game/">开始实习 →</a>
        <a class="subtle" href="/api/auth/zhihu">可选：知乎账号授权</a>
      </div>
      <div id="authorized" class="notice">知乎账号已完成授权校验。核心试玩不依赖登录，直接开始实习即可。</div>
    </main>
    <script>
      if (new URLSearchParams(location.search).get("zhihu") === "authorized") document.getElementById("authorized").style.display = "block";
    </script>
  </body>
</html>
